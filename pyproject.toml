# PEP 517 build-system declaration for ScrapydWeb.
# All package metadata and configuration live in setup.py;
# this file exists solely to enable modern build frontends
# (e.g. ``python -m build``) via the setuptools legacy backend.

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"
