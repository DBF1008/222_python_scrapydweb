# ──────────────────────────────────────────────────────────
# PEP 517 / 518 build configuration for ScrapydWeb
# ──────────────────────────────────────────────────────────
# All static metadata lives here.  The companion setup.py
# is a thin shim that only provides the dynamic fields
# declared below (version + readme).
# ──────────────────────────────────────────────────────────

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


# ── Project metadata ─────────────────────────────────────

[project]
name = "scrapydweb"
dynamic = ["version", "readme"]
description = "Web app for Scrapyd cluster management, with support for Scrapy log analysis & visualization."
authors = [
    {name = "my8100", email = "my8100@gmail.com"},
]
license = "GPL-3.0-only"
requires-python = ">=3.6"
classifiers = [
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "APScheduler==3.6.0",
    "click==7.1.2",
    "colorama==0.4.0",
    "Flask==2.0.0",
    "Flask-Compress==1.4.0",
    "Flask-SQLAlchemy==2.4.0",
    "idna==2.7",
    "itsdangerous==2.0.0",
    "Jinja2==3.0.0",
    "logparser>=0.8.4",
    "MarkupSafe==2.0.0",
    "pexpect==4.7.0",
    "ptyprocess==0.6.0",
    "pytz==2018.9",
    "requests>=2.21.0",
    "setuptools>=40.6.3",
    "six==1.16.0",
    "SQLAlchemy==1.3.24",
    "tzlocal==1.5.1",
    "w3lib==2.0.0",
    "Werkzeug==2.0.0",
]


# ── URLs ─────────────────────────────────────────────────

[project.urls]
Homepage = "https://github.com/my8100/scrapydweb"


# ── Console entry points ─────────────────────────────────

[project.scripts]
scrapydweb = "scrapydweb.run:main"


# ── Setuptools: package discovery ────────────────────────

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
include = ["scrapydweb*"]
exclude = ["tests*"]


# ── Setuptools: non-Python package data ──────────────────
# These globs ensure the wheel contains all runtime assets:
#   - static/:  CSS, JS, icons, fonts (27 files)
#   - templates/: Jinja2 HTML templates (37 files)
#   - data/: demo projects + sample log (18 files)

[tool.setuptools.package-data]
scrapydweb = [
    "static/**/*",
    "templates/**/*",
    "data/**/*",
]


# ── Setuptools: dynamic fields ───────────────────────────
# version:  read from scrapydweb/__version__.py at build time
#           (the file contains only string constants — no imports)
# readme:   provided by setup.py shim (needs runtime emoji stripping)

[tool.setuptools.dynamic]
version = {attr = "scrapydweb.__version__.__version__"}
