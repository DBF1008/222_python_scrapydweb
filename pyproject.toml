[build-system]
# setuptools >= 64 is load-bearing: recursive ``**`` package-data globs require
# setuptools >= 62.3.0; on older versions they expand to nothing and would
# silently ship a wheel with no static assets / templates / demo data.
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scrapydweb"
# Version stays sourced from scrapydweb/__version__.py (read via the AST-based
# ``attr`` directive below, so building never imports the package).
dynamic = ["version"]
description = "Web app for Scrapyd cluster management, with support for Scrapy log analysis & visualization."
readme = "README.md"
requires-python = ">=3.6"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "my8100", email = "my8100@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "APScheduler==3.6.0",  # Mar 18, 2019
    "click==7.1.2",  # Apr 28, 2020
    "colorama==0.4.0",  # Oct 10, 2018
    "Flask==2.0.0",  # May 12, 2021
    "Flask-Compress==1.4.0",  # Jan 5, 2017
    "Flask-SQLAlchemy==2.4.0",  # Apr 25, 2019
    "idna==2.7",  # Jun 11, 2018
    "itsdangerous==2.0.0",  # May 12, 2021
    "Jinja2==3.0.0",  # May 12, 2021
    "logparser>=0.8.4",
    "MarkupSafe==2.0.0",  # May 12, 2021
    "pexpect==4.7.0",  # Apr 7, 2019
    "ptyprocess==0.6.0",  # Jun 22, 2018
    "pytz==2018.9",  # Jan 7, 2019
    "requests>=2.21.0",  # Dec 10, 2018
    "setuptools>=40.6.3",  # Dec 11, 2018
    "six==1.16.0",  # May 5, 2021
    "SQLAlchemy==1.3.24",  # Mar 31, 2021
    "tzlocal==1.5.1",  # Dec 1, 2017
    "w3lib==2.0.0",  # Aug 11, 2022
    "Werkzeug==2.0.0",  # May 12, 2021
]

[project.optional-dependencies]
build = ["build", "twine"]

[project.urls]
Homepage = "https://github.com/my8100/scrapydweb"

[project.scripts]
scrapydweb = "scrapydweb.run:main"

[tool.setuptools]
# Wheel contents are driven solely by the explicit package-data globs below, so
# they are deterministic and independent of the VCS / MANIFEST state.
include-package-data = false
zip-safe = false

[tool.setuptools.dynamic]
version = { attr = "scrapydweb.__version__.__version__" }

[tool.setuptools.packages.find]
include = ["scrapydweb*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
# Ship runtime assets, templates and the canonical demo Scrapy project (its .py
# files ship as data, not importable modules). These globs match only the
# canonical demo, not the "ScrapydWeb_demo - 副本" unicode test fixture -- though
# the fixture's .py files are still added by setuptools' automatic Python-source
# discovery, matching the project's previous packaging behavior.
scrapydweb = [
    "static/**/*",
    "templates/**/*",
    "data/parse/*.log",
    "data/demo_projects/ScrapydWeb_demo/scrapy.cfg",
    "data/demo_projects/ScrapydWeb_demo/ScrapydWeb_demo/**/*",
]
